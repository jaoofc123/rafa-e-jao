<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rafaela &amp; João 💛</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--bg:#fffaf0;--y:#fff36e;--p:#ffd9e2;--m:#d9f2e3;--ink:#4a3a2f;--card:#fffdf5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2620;--y:#5a4f2a;--p:#5a3a45;--m:#2f4a3c;--ink:#fdf3dc;--card:#38322a}}
:root[data-theme="dark"]{--bg:#2b2620;--y:#5a4f2a;--p:#5a3a45;--m:#2f4a3c;--ink:#fdf3dc;--card:#38322a}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'VT323','Courier New',monospace;font-size:1.35rem;line-height:1.2;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 24px}
.pg{display:none;max-width:480px;margin:0 auto}.pg.on{display:block;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1,h2{margin:8px 0;text-align:center;font-weight:400;line-height:1}
h1{font-size:3rem}h2{font-size:2.2rem}
.mut{text-align:center;opacity:.7;margin:4px 0}
.w{background:var(--card);border:3px solid var(--ink);border-radius:12px;box-shadow:5px 5px 0 var(--ink);padding:14px;margin:16px 4px 16px 0}
.bt{display:block;width:100%;background:var(--y);color:var(--ink);border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);padding:12px;font:inherit;font-size:1.5rem;margin:10px 0}
.bt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.cnt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.cnt b{display:block;font-size:2.4rem;font-weight:400}
.menu{display:grid;grid-template-columns:1fr;gap:6px}
nav{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:3px solid var(--ink)}
nav button{flex:1;border:3px solid transparent;border-radius:10px;background:none;color:var(--ink);font:inherit;padding:4px 0}
nav button span{display:block;font-size:1.6rem}
nav button.on{background:var(--y);border-color:var(--ink)}
.back{border:0;background:none;color:var(--ink);font:inherit;text-decoration:underline;padding:4px 0}
/* intro */
#intro,#pz{position:fixed;inset:0;z-index:100;background:var(--y)}
#pz{z-index:90;background:var(--p);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
#love{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--y);color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center}
#love b{font-size:3.6rem;font-weight:400;border:4px solid var(--ink);border-radius:18px;padding:12px 26px;background:var(--card);box-shadow:6px 6px 0 var(--ink)}
#love.sh{animation:sh .25s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#intro .t,#intro .bo{position:absolute;left:0;right:0;text-align:center;pointer-events:none;padding:0 18px}
#intro .t{top:calc(10% + env(safe-area-inset-top,0px));font-size:3rem}
#intro .bo{bottom:calc(8% + env(safe-area-inset-bottom,0px));font-size:1.7rem}
.b{position:fixed;z-index:300;background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:6px 12px;box-shadow:3px 3px 0 var(--ink);transform:translate(-50%,-100%);pointer-events:none;max-width:78vw;font-size:1.5rem;text-align:center;animation:pop 1.9s forwards}
@keyframes pop{0%{opacity:0;margin-top:24px}15%{opacity:1;margin-top:0}80%{opacity:1;margin-top:-50px}100%{opacity:0;margin-top:-80px}}
#pb{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:min(88vw,360px);aspect-ratio:1;margin:12px auto;border:3px solid var(--ink);background:var(--ink);box-shadow:5px 5px 0 var(--ink)}
#pb div{background-size:300% 300%}#pb div.sel{outline:4px solid #ff7aa8;outline-offset:-4px;z-index:1}
#pb.ok{gap:0}
/* games */
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{aspect-ratio:1;border:3px solid var(--ink);border-radius:10px;background:var(--p);font-size:2rem;color:transparent;box-shadow:3px 3px 0 var(--ink);font-family:inherit}
.mc.up{background:var(--card);color:var(--ink)}.mc.ok{background:var(--m);color:var(--ink)}
.ar{position:relative;height:58vh;border:3px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:5px 5px 0 var(--ink);touch-action:none}
.fa{position:absolute;top:-80px;width:68px;height:68px;border:3px solid var(--ink);border-radius:50%;object-fit:cover;background:var(--p);animation:fall linear forwards;font-size:2rem;text-align:center;line-height:60px}
@keyframes fall{to{transform:translateY(var(--h))}}
.sky{background:#3d3a5c}
.st{position:absolute;border:0;background:none;padding:0;animation:drift var(--dur) ease-in-out var(--del) infinite;filter:drop-shadow(0 0 6px #fff3b8)}
.st.seen{opacity:.45}
@keyframes drift{50%{transform:translate(var(--dx),var(--dy)) rotate(18deg)}}
#md{position:fixed;inset:0;z-index:250;background:rgba(40,30,20,.6);display:none;align-items:center;justify-content:center;padding:20px}
#md .w{width:100%;max-width:380px;margin:0;text-align:center}
#md img{width:100%;aspect-ratio:1;object-fit:cover;border:3px solid var(--ink);border-radius:8px;display:block}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border:3px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink)}
.letter{white-space:pre-line;font-size:1.45rem;line-height:1.25}
.sign{text-align:right;font-size:2rem}
main{position:relative;z-index:1}nav{position:relative;z-index:2}
.pol{background:var(--card);border:3px solid var(--ink);border-radius:8px;box-shadow:5px 5px 0 var(--ink);padding:10px 10px 6px;transform:rotate(-1.5deg);margin:16px 4px 10px 0}
.pol img{width:100%;aspect-ratio:1;object-fit:cover;border:3px solid var(--ink);display:block}
.pol p{margin:8px 0 2px;text-align:center;font-size:1.7rem}
.mus{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--y)}
.mus .vin{font-size:3rem;animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.mus small{display:block;font-size:1.2rem;opacity:.85}.mus b{display:block;font-size:1.7rem;font-weight:400}.mus span{opacity:.75}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;display:none;pointer-events:none}#bg.on{display:block}
#bg img{position:absolute;aspect-ratio:1;object-fit:cover;filter:blur(7px);opacity:.65;border:3px solid var(--ink);border-radius:10px;will-change:transform}
#p2{padding-bottom:55vh}.w.letter{background:color-mix(in srgb,var(--card) 80%,transparent)}
.mc.up,.mc.ok{background-size:cover;background-position:center}.mc.ok{border-color:#2fb36b}
.mc:not(.up):not(.ok)::after{content:"💛";color:var(--ink);font-size:2rem}
</style></head><body>

<div id="intro">
 <button id="love"><b>Eu te amo 💗</b></button>
 <div class="t">você me ama??</div>
 <div class="bo">Rafaela, eu tenho que ter certeza!!</div>
</div>

<div id="pz"><h2>Monte nossa foto 🧩</h2><p class="mut">toque em duas peças para trocar</p><div id="pb"></div><p id="pm" class="mut"></p></div>

<div id="md"><div class="w"><img id="mi" alt=""><p id="mt" style="margin:10px 0 0"></p><button class="bt" onclick="md.style.display='none'">fechar</button></div></div>

<div id="app">
<div id="bg"></div>
<main>
 <div class="pg on" id="p0">
  <h1>Rafaela &amp; João</h1>
  <div class="pol"><img id="hp" alt=""><p id="hl"></p></div>
  <p class="mut" id="ds" style="font-size:1.5rem"></p>
  <a class="w mus" id="mk" target="_blank" rel="noopener"><div class="vin">💿</div><div><small>🎵 música que eu amo, espero que você ame.</small><b id="mn"></b><span id="ma"></span></div></a>
  <p class="mut" style="margin-top:20px">Feito com carinho. Simples, mas espero que você goste muito. 💛</p>
 </div>

 <div class="pg" id="p1">
  <h2>Jogos</h2>
  <div id="menu"><div class="menu">
   <button class="bt" onclick="game('mem')">🃏 Memória</button>
   <button class="bt" style="background:var(--p)" onclick="game('catch')">🙋‍♂️ Pega-Joãos</button>
   <button class="bt" style="background:var(--m)" onclick="game('sdds')">⭐ Sdds?</button></div></div>
  <div id="g" style="display:none"></div>
 </div>

 <div class="pg" id="p2">
  <h2>Nós</h2>
  <div class="w letter" id="letter"></div><div class="sign">— João</div>
  <p class="mut" style="margin-top:20px"><a href="#" id="th" style="color:var(--ink)">trocar tema</a></p>
 </div>
</main>
<nav><button class="on" onclick="go(0)"><span>🏠</span>Início</button><button onclick="go(1)"><span>🎮</span>Jogos</button><button onclick="go(2)"><span>💌</span>Nós</button></nav>
</div>
